name: Make Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias reimbursement \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASS }}" \
            -keypass "${{ secrets.KEYSTORE_PASS }}" \
            -dname "CN=Reimbursement App, OU=Personal, O=Personal, L=Kunming, ST=Yunnan, C=CN"
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: release.keystore
