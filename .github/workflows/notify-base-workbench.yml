name: Notify base workbench

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to synchronize
        required: true
        type: string

permissions: {}

jobs:
  notify:
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BASE_WORKBENCH_DISPATCH_TOKEN }}
      SOURCE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - name: Dispatch reimbursement release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing BASE_WORKBENCH_DISPATCH_TOKEN secret" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_TAG" =~ ^v?[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Invalid release tag: $SOURCE_TAG" >&2
            exit 1
          fi
          gh api --method POST repos/m0ba/base-workbench/dispatches \
            -f event_type=reimbursement-release \
            -f client_payload[tag]="$SOURCE_TAG"
