name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          ls "$ANDROID_HOME/platforms"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "missing ANDROID_KEYSTORE_BASE64" >&2; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ls -l "$RUNNER_TEMP/release.keystore"

      - name: Assemble APK
        env:
          REIMB_KEYSTORE: ${{ runner.temp }}/release.keystore
          REIMB_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REIMB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REIMB_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p release
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "release/reimbursement-${VERSION}.apk"
          ls -lh release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: release/*.apk

  desktop:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            name: mac
            cmd: npm run dist:mac
          - os: windows-latest
            name: win
            cmd: npm run dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Copy web build into desktop shell
        shell: bash
        run: |
          mkdir -p desktop/app
          cp -R dist/. desktop/app/
          ls desktop/app | head

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Set desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p=require('./desktop/package.json');p.version=process.argv[1];fs.writeFileSync('./desktop/package.json',JSON.stringify(p,null,2))" "$VERSION"

      - name: Build ${{ matrix.name }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.cmd }}

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/release/*.exe
            desktop/release/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: List files
        run: find release -type f -maxdepth 3 -printf '%p %k KB\n' | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/apk/*.apk
            release/desktop-mac/*.zip
            release/desktop-win/*.exe
          name: 报销助手 ${{ github.ref_name }}
          body: |
            ## 报销助手 ${{ github.ref_name }}

            本地优先的报销材料工具：发票 A4 拼版、发票信息表、行程轨迹图，全部在设备上处理，不上传。

            **Android**
            - `reimbursement-<版本>.apk`，安装时需要允许「安装未知来源应用」

            **Windows（免安装）**
            - `reimbursement-<版本>-win.exe`，下载后双击即用，不需要安装
            - 首次运行如提示「Windows 已保护你的电脑」，点「更多信息」→「仍要运行」

            **macOS（免安装）**
            - `reimbursement-<版本>-mac-arm64.zip`（Apple 芯片）或 `-mac-x64.zip`（Intel）
            - 解压后双击「报销助手」运行；首次打开如被拦截，右键 →「打开」

            桌面版与手机版共用同一套本地数据格式，首次打开会引导阅读说明并预热 OCR 模型。

            完整改动见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
